<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTP CDMX - Monitoreo & Búsqueda Completa</title>
    
    <meta name="theme-color" content="#006837">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #121212; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .glass-panel {
            background: rgba(18, 18, 18, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaflet-popup-content-wrapper {
            background: #1e1e1e !important;
            color: #f3f4f6 !important;
            border-radius: 12px !important;
            padding: 0 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }
        .leaflet-popup-tip { background: #1e1e1e !important; }
        .leaflet-popup-content { margin: 0 !important; }

        @keyframes userPulse {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .user-gps-pulse { animation: userPulse 2s infinite ease-out; border-radius: 50%; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- Header Control -->
    <header class="absolute top-0 left-0 right-0 z-20 p-3 pointer-events-none flex justify-between items-center">
        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-toggle-drawer" class="glass-panel text-white p-3 rounded-xl shadow-lg hover:bg-gray-800 transition">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="glass-panel px-3 py-2 rounded-xl shadow-lg flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-700 flex items-center justify-center text-white font-bold text-sm shadow">
                    RTP
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white">RTP CDMX</h1>
                    <span id="gps-status" class="text-[10px] text-amber-400 font-medium">Buscando GPS...</span>
                </div>
            </div>
        </div>

        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-locate" class="glass-panel bg-blue-600/30 text-blue-300 border border-blue-500/40 px-3 py-2 rounded-xl text-xs font-semibold shadow-lg hover:bg-blue-600/50 transition flex items-center gap-1.5">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span class="hidden sm:inline">Mi Ubicación</span>
            </button>
        </div>
    </header>

    <!-- Mapa -->
    <main class="relative flex-1 w-full h-full">
        <div id="map"></div>

        <!-- Tarjeta Flotante de Ruta Más Cercana -->
        <div id="nearest-card" class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-96 z-10 glass-panel rounded-2xl p-3 shadow-2xl flex items-center justify-between border border-emerald-500/30">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-location-arrow text-lg"></i>
                </div>
                <div>
                    <span class="text-[10px] uppercase text-emerald-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-bolt"></i> Ruta más cercana
                    </span>
                    <h2 id="nearest-title" class="text-xs font-bold text-white truncate max-w-[180px]">Obteniendo posición...</h2>
                    <p id="nearest-sub" class="text-[11px] text-gray-400">Calculando distancia...</p>
                </div>
            </div>
            <button id="btn-focus-nearest" class="bg-emerald-600/30 text-emerald-300 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-emerald-600/60 transition">
                Ver
            </button>
        </div>
    </main>

    <!-- Panel Lateral -->
    <aside id="side-drawer" class="fixed top-0 left-0 bottom-0 w-full sm:w-96 z-40 glass-panel border-r border-gray-800 transform -translate-x-full transition-transform duration-300 flex flex-col">
        
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <div>
                <h2 class="font-bold text-base text-white">Rutas del Sistema</h2>
                <p class="text-[11px] text-gray-400">Ordenadas por cercanía a tu ubicación</p>
            </div>
            <button id="btn-close-drawer" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Buscador de Rutas -->
        <div class="p-3 border-b border-gray-800 bg-gray-950/60">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="route-search-input" placeholder="Buscar por número o nombre (ej. 34-A, Balderas)..." 
                       class="w-full bg-gray-900 border border-gray-700/80 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Lista de Rutas -->
        <div id="nearby-routes-list" class="flex-1 overflow-y-auto p-4 space-y-2.5">
            <!-- Se llena dinámicamente -->
        </div>
    </aside>

    <script>
        // Catálogo de Rutas RTP con sus puntos de referencia exactos por calle
        const RTP_STATIONS_DATA = [
            {
                id: "34-A",
                number: "34-A",
                name: "Balderas - Santa Fe",
                fare: "$4.00",
                color: "#d97706",
                category: "Express",
                waypoints: [
                    [19.42730, -99.14920], // Metro Balderas
                    [19.42650, -99.15300], // Arcos de Belén
                    [19.42480, -99.15900], // Av. Chapultepec
                    [19.42110, -99.17150], // M. Chapultepec
                    [19.41680, -99.18120], // Av. Constituyentes
                    [19.39810, -99.20600], // Constituyentes y Periférico
                    [19.38720, -99.22250], // Carretera México-Toluca
                    [19.36900, -99.25100], // Av. Vasco de Quiroga
                    [19.36220, -99.26050]  // Centro Comercial Santa Fe
                ]
            },
            {
                id: "200",
                number: "200",
                name: "Circuito Bicentenario",
                fare: "$3.50",
                color: "#006837",
                category: "Ecobús",
                waypoints: [
                    [19.45600, -99.14200], // La Raza
                    [19.44800, -99.12300], // Río Consulado
                    [19.43200, -99.10900], // Aeropuerto T1
                    [19.40800, -99.10200], // Churubusco / Eje 3 Sur
                    [19.35900, -99.15500], // Churubusco / Tlalpan
                    [19.36800, -99.18100], // Patriotismo
                    [19.39800, -99.18700], // Revolución
                    [19.43100, -99.17300]  // Melchor Ocampo
                ]
            },
            {
                id: "57-A",
                number: "57-A",
                name: "Cuatro Caminos - Constitución de 1917",
                fare: "$2.00",
                color: "#2563eb",
                category: "Ordinario",
                waypoints: [
                    [19.45900, -99.21500], // Cuatro Caminos
                    [19.44800, -99.20200], // Calz. México-Tacuba
                    [19.41500, -99.14300], // Eje Central Lázaro Cárdenas
                    [19.35700, -99.12500], // Eje 8 Sur Ermita
                    [19.34500, -99.06300]  // CETRAM Constitución de 1917
                ]
            }
        ];

        let map;
        let userLocation = null;
        let userMarker = null;
        let processedRoutes = [];
        let loadedPolylines = {};
        let routeStreetGeometries = {};

        function initMap() {
            map = L.map('map', { center: [19.4326, -99.1332], zoom: 12, zoomControl: false });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Obtener trazados exactos por calle vía OSRM
            fetchStreetExactRoutes().then(() => {
                getUserLocation();
            });

            // Listener de búsqueda por nombre o número
            document.getElementById('route-search-input').addEventListener('input', (e) => {
                renderRoutesList(e.target.value);
            });
        }

        async function fetchStreetExactRoutes() {
            for (let route of RTP_STATIONS_DATA) {
                const coordinatesString = route.waypoints
                    .map(wp => `${wp[1]},${wp[0]}`)
                    .join(';');

                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordinatesString}?overview=full&geometries=geojson`;

                try {
                    const response = await fetch(osrmUrl);
                    const data = await response.json();

                    if (data.routes && data.routes.length > 0) {
                        const streetPath = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                        routeStreetGeometries[route.id] = streetPath;
                        drawRoutePolyline(route, streetPath);
                    } else {
                        routeStreetGeometries[route.id] = route.waypoints;
                        drawRoutePolyline(route, route.waypoints);
                    }
                } catch (e) {
                    routeStreetGeometries[route.id] = route.waypoints;
                    drawRoutePolyline(route, route.waypoints);
                }
            }
        }

        function drawRoutePolyline(route, pathCoords) {
            const polyline = L.polyline(pathCoords, {
                color: route.color,
                weight: 5,
                opacity: 0.85,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            polyline.bindPopup(`
                <div class="p-3">
                    <span class="text-[10px] font-bold text-emerald-400 uppercase">Ruta ${route.number} (${route.fare})</span>
                    <h3 class="font-bold text-sm text-white mt-0.5">${route.name}</h3>
                    <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-bus text-emerald-400"></i> Servicio ${route.category}</p>
                </div>
            `);

            loadedPolylines[route.id] = polyline;
        }

        function getUserLocation() {
            const gpsStatus = document.getElementById('gps-status');

            if (!navigator.geolocation) {
                fallbackDefaultLocation();
                return;
            }

            gpsStatus.textContent = "Obteniendo GPS...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = [pos.coords.latitude, pos.coords.longitude];
                    gpsStatus.textContent = "GPS Activo";
                    gpsStatus.className = "text-[10px] text-emerald-400 font-medium";

                    updateUserMarker();
                    calculateAllDistances();
                },
                (err) => {
                    gpsStatus.textContent = "Ubicación aprox. (CDMX)";
                    gpsStatus.className = "text-[10px] text-amber-400 font-medium";
                    fallbackDefaultLocation();
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        }

        function fallbackDefaultLocation() {
            userLocation = [19.4230, -99.1630]; // Chapultepec / Roma Norte
            updateUserMarker();
            calculateAllDistances();
        }

        function updateUserMarker() {
            if (!userLocation) return;

            if (userMarker) map.removeLayer(userMarker);

            const icon = L.divIcon({
                className: 'custom-user-icon',
                html: `
                    <div class="relative flex items-center justify-center w-8 h-8">
                        <div class="absolute w-8 h-8 bg-blue-500/40 user-gps-pulse"></div>
                        <div class="w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-lg z-10"></div>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            userMarker = L.marker(userLocation, { icon: icon }).addTo(map);
            map.flyTo(userLocation, 13, { duration: 1.2 });
        }

        function getMinDistanceToRoute(userCoords, routePath) {
            let minDistance = Infinity;

            for (let point of routePath) {
                const dist = calculateDistanceMeters(userCoords[0], userCoords[1], point[0], point[1]);
                if (dist < minDistance) minDistance = dist;
            }

            return minDistance;
        }

        function calculateAllDistances() {
            if (!userLocation) return;

            processedRoutes = RTP_STATIONS_DATA.map(route => {
                const exactPath = routeStreetGeometries[route.id] || route.waypoints;
                const distanceMeters = getMinDistanceToRoute(userLocation, exactPath);
                return {
                    ...route,
                    distanceMeters: Math.round(distanceMeters)
                };
            });

            // Ordenar por cercanía (de menor a mayor distancia)
            processedRoutes.sort((a, b) => a.distanceMeters - b.distanceMeters);

            // Actualizar tarjeta inferior con la ruta más cercana
            if (processedRoutes.length > 0) {
                const nearest = processedRoutes[0];
                const distLabel = nearest.distanceMeters >= 1000 
                    ? `${(nearest.distanceMeters/1000).toFixed(1)} km` 
                    : `${nearest.distanceMeters} m`;

                document.getElementById('nearest-title').textContent = `Ruta ${nearest.number} - ${nearest.name}`;
                document.getElementById('nearest-sub').textContent = `Pasa a ${distLabel} de tu posición`;
                
                document.getElementById('btn-focus-nearest').onclick = () => {
                    if (loadedPolylines[nearest.id]) {
                        map.fitBounds(loadedPolylines[nearest.id].getBounds(), { padding: [50, 50] });
                        loadedPolylines[nearest.id].openPopup();
                    }
                };
            }

            renderRoutesList();
        }

        function renderRoutesList(filterText = '') {
            const container = document.getElementById('nearby-routes-list');
            container.innerHTML = '';

            const term = filterText.toLowerCase().trim();

            const filtered = processedRoutes.filter(route => {
                return route.number.toLowerCase().includes(term) || 
                       route.name.toLowerCase().includes(term) ||
                       route.category.toLowerCase().includes(term);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 px-4 bg-gray-900/60 rounded-xl border border-gray-800">
                        <i class="fa-solid fa-magnifying-glass text-gray-500 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-gray-300">No se encontraron rutas</h4>
                        <p class="text-[11px] text-gray-500 mt-1">Intenta con otro número o nombre.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((item, index) => {
                const formatDist = item.distanceMeters >= 1000 
                    ? `${(item.distanceMeters/1000).toFixed(1)} km` 
                    : `${item.distanceMeters} m`;

                const card = document.createElement('div');
                card.className = "p-3 bg-gray-900 rounded-xl border border-gray-800 hover:border-emerald-500/50 cursor-pointer transition space-y-1.5";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded text-white" style="background-color: ${item.color}">
                                ${item.number}
                            </span>
                            <span class="font-semibold text-xs text-white truncate max-w-[160px]">${item.name}</span>
                        </div>
                        <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-600/30 font-bold px-2 py-0.5 rounded">${item.fare}</span>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-gray-400 pt-1">
                        <span>Servicio: <strong class="text-gray-300">${item.category}</strong></span>
                        <span class="text-emerald-400 font-semibold"><i class="fa-solid fa-person-walking text-xs"></i> A ${formatDist}</span>
                    </div>
                `;

                card.onclick = () => {
                    if (loadedPolylines[item.id]) {
                        map.fitBounds(loadedPolylines[item.id].getBounds(), { padding: [50, 50] });
                        loadedPolylines[item.id].openPopup();

                        if (window.innerWidth < 640) {
                            document.getElementById('side-drawer').classList.add('-translate-x-full');
                        }
                    }
                };

                container.appendChild(card);
            });
        }

        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // Eventos
        document.getElementById('btn-toggle-drawer').onclick = () => document.getElementById('side-drawer').classList.remove('-translate-x-full');
        document.getElementById('btn-close-drawer').onclick = () => document.getElementById('side-drawer').classList.add('-translate-x-full');
        document.getElementById('btn-locate').onclick = () => getUserLocation();

        window.onload = initMap;
    </script>
</body>
</html>
