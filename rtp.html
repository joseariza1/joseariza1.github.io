<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTP CDMX - Monitoreo Oficial y Rutas Cercanas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --rtp-green: #006837;
            --rtp-gold: #D4AF37;
        }
        .bg-rtp-green { background-color: var(--rtp-green); }
        .text-rtp-green { color: var(--rtp-green); }
        .border-rtp-green { border-color: var(--rtp-green); }
        
        #map { height: calc(100vh - 64px); width: 100%; z-index: 1; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 4px; }
        .dark .leaflet-popup-content-wrapper, .dark .leaflet-popup-tip {
            background-color: #1f2937;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen overflow-hidden flex flex-col font-sans">

    <!-- Top Navigation Header -->
    <header class="bg-rtp-green text-white shadow-md z-20 flex items-center justify-between px-4 py-3 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-white p-1.5 rounded-lg shadow text-rtp-green font-black text-xl tracking-wider">
                RTP
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Rutas Oficiales CDMX</h1>
                <p class="text-xs text-green-100 flex items-center gap-1">
                    <span id="api-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                    <span id="api-status-text">Cargando API Movilidad...</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Radius Select Filter -->
            <div class="relative">
                <select id="radius-select" class="bg-emerald-800 text-xs text-white rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400 border border-emerald-700">
                    <option value="1">1 km</option>
                    <option value="3" selected>3 km</option>
                    <option value="5">5 km</option>
                    <option value="10">10 km</option>
                    <option value="all">Todas las rutas</option>
                </select>
            </div>

            <!-- Locate Me Button -->
            <button id="locate-btn" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-gray-900 font-semibold text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow">
                <i data-lucide="crosshair" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Mi Ubicación</span>
            </button>

            <!-- Refresh Button -->
            <button id="refresh-btn" class="p-1.5 hover:bg-emerald-800 rounded-lg transition" title="Reconsultar API">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Body Layout -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- Sidebar Panel -->
        <aside id="sidebar" class="w-full md:w-96 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-10 absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-xl md:shadow-none">
            
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 space-y-3">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Buscar por ruta o parada..." class="w-full pl-9 pr-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rtp-green dark:text-white">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
                </div>

                <div class="flex gap-2">
                    <button id="tab-routes" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-rtp-green text-white shadow-sm">
                        Rutas Cercanas (<span id="route-count">0</span>)
                    </button>
                    <button id="tab-stops" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200">
                        Paradas (<span id="stop-count">0</span>)
                    </button>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamically Filled -->
            </div>

            <div class="p-3 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 text-xs flex justify-between text-gray-500 dark:text-gray-400">
                <span>Radio activo: <strong id="current-radius-label" class="text-gray-800 dark:text-gray-200">3 km</strong></span>
                <span>Fuente: <strong id="data-source-label" class="text-emerald-600 font-semibold">API CDMX</strong></span>
            </div>
        </aside>

        <!-- Mobile Toggle Button -->
        <button id="toggle-sidebar-btn" class="md:hidden absolute top-4 left-4 z-20 bg-white dark:bg-gray-800 p-2.5 rounded-full shadow-lg text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map"></div>
            
            <div id="user-location-banner" class="hidden absolute top-4 right-4 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md px-3 py-2 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 text-xs">
                <span class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    GPS Detectado
                </span>
            </div>
        </main>
    </div>

    <!-- Application Engine -->
    <script>
        // Official Fallback Data (In case API is unreachable)
        const FALLBACK_ROUTES = [
            {
                id: "34-A",
                code: "34-A",
                name: "Metro Balderas - Santa Fe",
                color: "#006837",
                stops: [
                    { name: "Metro Balderas", lat: 19.4273, lng: -99.1492 },
                    { name: "Av. Chapultepec", lat: 19.4231, lng: -99.1620 },
                    { name: "Metro Sevilla", lat: 19.4219, lng: -99.1705 },
                    { name: "Constituyentes", lat: 19.4085, lng: -99.1950 },
                    { name: "Santa Fe Center", lat: 19.3620, lng: -99.2625 }
                ]
            },
            {
                id: "13-A",
                code: "13-A",
                name: "Metro Chapultepec - Pedregal de San Nicolás",
                color: "#008844",
                stops: [
                    { name: "Metro Chapultepec", lat: 19.4205, lng: -99.1764 },
                    { name: "Periférico Sur", lat: 19.3300, lng: -99.1990 },
                    { name: "Pedregal de San Nicolás", lat: 19.2850, lng: -99.2150 }
                ]
            },
            {
                id: "76",
                code: "76",
                name: "Metro Centro Médico - Santa Fe",
                color: "#D4AF37",
                stops: [
                    { name: "Centro Médico", lat: 19.4068, lng: -99.1550 },
                    { name: "Tacubaya", lat: 19.4015, lng: -99.1870 },
                    { name: "Santa Fe", lat: 19.3600, lng: -99.2600 }
                ]
            },
            {
                id: "200",
                code: "200",
                name: "Circuito Bicentenario",
                color: "#2563eb",
                stops: [
                    { name: "Metro Oceanía", lat: 19.4455, lng: -99.0872 },
                    { name: "La Raza", lat: 19.4700, lng: -99.1370 },
                    { name: "Chapultepec", lat: 19.4205, lng: -99.1764 },
                    { name: "Coyoacán", lat: 19.3610, lng: -99.1710 }
                ]
            },
            {
                id: "57-A",
                code: "57-A",
                name: "Toreo - Metro Constitución de 1917",
                color: "#dc2626",
                stops: [
                    { name: "Toreo / Cuatro Caminos", lat: 19.4590, lng: -99.2155 },
                    { name: "Metro Observatorio", lat: 19.3982, lng: -99.2001 },
                    { name: "Metro Mixcoac", lat: 19.3760, lng: -99.1875 },
                    { name: "Metro Constitución de 1917", lat: 19.3450, lng: -99.0638 }
                ]
            }
        ];

        // Global State
        let map;
        let userLocation = { lat: 19.4326, lng: -99.1332 }; // Centro Histórico CDMX
        let userMarker = null;
        let userCircle = null;
        let allRoutes = [];
        let mapMarkers = [];
        let mapPolylines = [];
        let activeTab = 'routes';

        // Haversine formula (Distance in km)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([userLocation.lat, userLocation.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap | RTP CDMX'
            }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function updateUserPosition(lat, lng) {
            userLocation = { lat, lng };

            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);

            userMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'user-icon',
                    html: `<div class="w-5 h-5 bg-blue-600 border-2 border-white rounded-full shadow-lg flex items-center justify-center animate-bounce">
                            <div class="w-2 h-2 bg-white rounded-full"></div>
                           </div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                })
            }).addTo(map);

            const selectedRadius = document.getElementById('radius-select').value;
            if (selectedRadius !== 'all') {
                userCircle = L.circle([lat, lng], {
                    radius: parseFloat(selectedRadius) * 1000,
                    color: '#006837',
                    fillColor: '#006837',
                    fillOpacity: 0.08,
                    weight: 1.5
                }).addTo(map);
            }

            document.getElementById('user-location-banner').classList.remove('hidden');
            renderUI();
        }

        // Fetch Official Routes & Stops from CDMX API
        async function fetchOfficialRTPRoutes() {
            const statusDot = document.getElementById('api-status-dot');
            const statusText = document.getElementById('api-status-text');
            const sourceLabel = document.getElementById('data-source-label');

            try {
                statusText.innerText = "Consultando API CDMX...";
                
                // Fetch line geometry & station points from CDMX Open Mobility API
                const [linesRes, stopsRes] = await Promise.all([
                    fetch('https://apimetro.dev/movilidad/mapas/geojsonLinea?sistema=RTP'),
                    fetch('https://apimetro.dev/movilidad/RTP/estacion')
                ]);

                if (linesRes.ok && stopsRes.ok) {
                    const linesGeoJSON = await linesRes.json();
                    const stopsData = await stopsRes.json();

                    allRoutes = processAPIData(linesGeoJSON, stopsData);
                    
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse";
                    statusText.innerText = "API CDMX Conectada";
                    sourceLabel.innerText = "API Movilidad CDMX";
                    renderUI();
                    return;
                }
            } catch (err) {
                console.warn("API CDMX no disponible. Cargando respaldo de rutas oficiales RTP.", err);
            }

            // Fallback Engine
            allRoutes = FALLBACK_ROUTES;
            statusDot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block";
            statusText.innerText = "Modo Respaldo Oficial";
            sourceLabel.innerText = "Respaldo Oficial";
            renderUI();
        }

        function processAPIData(geoJsonLines, rawStops) {
            const routesMap = {};

            if (geoJsonLines && geoJsonLines.features) {
                geoJsonLines.features.forEach(feat => {
                    const code = feat.properties.num_comercial || feat.properties.linea || "RTP";
                    const name = feat.properties.nombre || `Ruta ${code}`;
                    if (!routesMap[code]) {
                        routesMap[code] = {
                            id: code,
                            code: code,
                            name: name,
                            color: feat.properties.color || "#006837",
                            stops: []
                        };
                    }
                });
            }

            // Group Stops
            if (Array.isArray(rawStops)) {
                rawStops.forEach(stop => {
                    const code = stop.linea || stop.num_comercial;
                    if (code && routesMap[code]) {
                        routesMap[code].stops.push({
                            name: stop.nombre || stop.estacion || "Parada RTP",
                            lat: parseFloat(stop.latitud || stop.lat),
                            lng: parseFloat(stop.longitud || stop.lng)
                        });
                    }
                });
            }

            return Object.values(routesMap).length > 0 ? Object.values(routesMap) : FALLBACK_ROUTES;
        }

        // Render Filtered Data on Map & Sidebar
        function renderUI() {
            const selectedRadius = document.getElementById('radius-select').value;
            const radiusKm = selectedRadius === 'all' ? Infinity : parseFloat(selectedRadius);
            const query = document.getElementById('search-input').value.toLowerCase();

            // Clear Layer
            mapMarkers.forEach(m => map.removeLayer(m));
            mapPolylines.forEach(p => map.removeLayer(p));
            mapMarkers = [];
            mapPolylines = [];

            let totalStopsCount = 0;

            // Filter & Order Routes by closest stop distance
            const filteredRoutes = allRoutes.map(route => {
                const stopsWithDistance = route.stops.map(stop => {
                    if (!stop || isNaN(stop.lat) || isNaN(stop.lng)) return null;
                    const distance = getDistanceKm(userLocation.lat, userLocation.lng, stop.lat, stop.lng);
                    return { ...stop, distance };
                }).filter(Boolean);

                const minDistance = stopsWithDistance.length > 0 
                    ? Math.min(...stopsWithDistance.map(s => s.distance)) 
                    : Infinity;

                return {
                    ...route,
                    stops: stopsWithDistance,
                    minDistance
                };
            }).filter(route => {
                const matchesSearch = route.name.toLowerCase().includes(query) || route.code.toLowerCase().includes(query);
                return route.minDistance <= radiusKm && matchesSearch;
            }).sort((a, b) => a.minDistance - b.minDistance);

            // Draw filtered elements on map
            filteredRoutes.forEach(route => {
                if (route.stops.length > 1) {
                    const polyline = L.polyline(route.stops.map(s => [s.lat, s.lng]), {
                        color: route.color,
                        weight: 4,
                        opacity: 0.8
                    }).addTo(map);
                    mapPolylines.push(polyline);
                }

                route.stops.forEach(stop => {
                    totalStopsCount++;
                    const stopMarker = L.circleMarker([stop.lat, stop.lng], {
                        radius: 5,
                        color: route.color,
                        fillColor: '#FFFFFF',
                        fillOpacity: 1,
                        weight: 2
                    }).bindPopup(`
                        <div class="p-1">
                            <strong class="text-emerald-700 font-bold">${stop.name}</strong><br>
                            <span class="text-xs text-gray-500">Ruta ${route.code} - ${route.name}</span><br>
                            <span class="text-xs text-amber-600 font-semibold">Distancia: ${stop.distance.toFixed(2)} km</span>
                        </div>
                    `).addTo(map);
                    mapMarkers.push(stopMarker);
                });
            });

            document.getElementById('route-count').innerText = filteredRoutes.length;
            document.getElementById('stop-count').innerText = totalStopsCount;

            renderSidebarList(filteredRoutes);
            lucide.createIcons();
        }

        function renderSidebarList(routes) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (activeTab === 'routes') {
                if (routes.length === 0) {
                    container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No se encontraron rutas RTP dentro del radio establecido.</div>`;
                    return;
                }

                routes.forEach(route => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-gray-700/50 p-3.5 rounded-xl border border-gray-200 dark:border-gray-600 hover:shadow-md transition cursor-pointer";
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-0.5 bg-rtp-green text-white text-xs font-bold rounded">Ruta ${route.code}</span>
                            <span class="text-xs text-amber-600 dark:text-amber-400 font-medium">A ${route.minDistance.toFixed(2)} km</span>
                        </div>
                        <h4 class="font-semibold text-sm mt-1.5 text-gray-800 dark:text-gray-100">${route.name}</h4>
                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-2 flex justify-between">
                            <span>Paradas oficiales: <b>${route.stops.length}</b></span>
                            <span class="text-emerald-600 font-medium">Activa</span>
                        </div>
                    `;
                    card.onclick = () => {
                        if (route.stops.length > 0) {
                            const bounds = L.latLngBounds(route.stops.map(s => [s.lat, s.lng]));
                            map.fitBounds(bounds, { padding: [50, 50] });
                        }
                    };
                    container.appendChild(card);
                });
            } else {
                // Collect All Stops Flattened
                const allStops = routes.flatMap(r => r.stops.map(s => ({ ...s, routeCode: r.code, routeName: r.name })))
                                       .sort((a, b) => a.distance - b.distance);

                if (allStops.length === 0) {
                    container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No hay paradas en el radio actual.</div>`;
                    return;
                }

                allStops.slice(0, 50).forEach(stop => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-gray-700/50 p-3 rounded-xl border border-gray-200 dark:border-gray-600 hover:shadow-md transition cursor-pointer";
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-sm text-rtp-green dark:text-emerald-400">${stop.name}</span>
                            <span class="text-xs text-gray-500 font-medium">A ${stop.distance.toFixed(2)} km</span>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Ruta ${stop.routeCode} - ${stop.routeName}</p>
                    `;
                    card.onclick = () => {
                        map.setView([stop.lat, stop.lng], 16);
                    };
                    container.appendChild(card);
                });
            }
        }

        // Attach DOM Controls
        function setupControls() {
            document.getElementById('locate-btn').addEventListener('click', () => {
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            updateUserPosition(pos.coords.latitude, pos.coords.longitude);
                            map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                        },
                        () => alert("GPS deshabilitado o no disponible.")
                    );
                }
            });

            document.getElementById('radius-select').addEventListener('change', (e) => {
                document.getElementById('current-radius-label').innerText = e.target.value === 'all' ? 'Todas' : `${e.target.value} km`;
                updateUserPosition(userLocation.lat, userLocation.lng);
            });

            document.getElementById('search-input').addEventListener('input', renderUI);

            document.getElementById('tab-routes').addEventListener('click', (e) => {
                activeTab = 'routes';
                e.target.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-rtp-green text-white shadow-sm";
                document.getElementById('tab-stops').className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200";
                renderUI();
            });

            document.getElementById('tab-stops').addEventListener('click', (e) => {
                activeTab = 'stops';
                e.target.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-rtp-green text-white shadow-sm";
                document.getElementById('tab-routes').className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200";
                renderUI();
            });

            document.getElementById('refresh-btn').addEventListener('click', fetchOfficialRTPRoutes);

            document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initMap();
            setupControls();
            fetchOfficialRTPRoutes();

            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => updateUserPosition(pos.coords.latitude, pos.coords.longitude),
                    () => updateUserPosition(userLocation.lat, userLocation.lng)
                );
            } else {
                updateUserPosition(userLocation.lat, userLocation.lng);
            }
        });
    </script>
</body>
</html>
