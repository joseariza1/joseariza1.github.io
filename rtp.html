<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTP CDMX - Rutas Multicolor & Selección Completa</title>
    
    <meta name="theme-color" content="#006837">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #121212; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .glass-panel {
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .leaflet-popup-content-wrapper {
            background: #1e1e1e !important;
            color: #f3f4f6 !important;
            border-radius: 12px !important;
            padding: 0 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }
        .leaflet-popup-tip { background: #1e1e1e !important; }
        .leaflet-popup-content { margin: 0 !important; }

        .route-label-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 11px !important;
            border-radius: 6px !important;
            padding: 3px 7px !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }
        .route-label-tooltip::before { display: none !important; }

        @keyframes userPulse {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .user-gps-pulse { animation: userPulse 2s infinite ease-out; border-radius: 50%; }

        .rtp-stop-icon {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- Header Control -->
    <header class="absolute top-0 left-0 right-0 z-20 p-3 pointer-events-none flex justify-between items-center">
        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-toggle-drawer" class="glass-panel text-white p-3 rounded-xl shadow-lg hover:bg-gray-800 transition">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="glass-panel px-3 py-2 rounded-xl shadow-lg flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-700 flex items-center justify-center text-white font-bold text-sm shadow">
                    RTP
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white">RTP CDMX (Rutas Multicolor)</h1>
                    <span id="api-status" class="text-[10px] text-amber-400 font-medium">Buscando posición...</span>
                </div>
            </div>
        </div>

        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-locate" class="glass-panel bg-blue-600/30 text-blue-300 border border-blue-500/40 px-3 py-2 rounded-xl text-xs font-semibold shadow-lg hover:bg-blue-600/50 transition flex items-center gap-1.5">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span class="hidden sm:inline">Recargar Zona</span>
            </button>
        </div>
    </header>

    <!-- Mapa -->
    <main class="relative flex-1 w-full h-full">
        <div id="map"></div>

        <!-- Leyenda de Sentidos -->
        <div class="absolute top-20 right-4 z-10 glass-panel p-3 rounded-xl text-[11px] space-y-1.5 hidden sm:block">
            <div class="font-bold text-gray-300 border-b border-gray-700 pb-1 mb-1">Simbología de Sentido</div>
            <div class="flex items-center gap-2">
                <div class="w-6 h-1 bg-white rounded"></div>
                <span class="text-gray-300">Trayecto de Ida (Continua)</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-6 h-1 border-b-2 border-dashed border-white"></div>
                <span class="text-gray-300">Trayecto Regreso (Punteada)</span>
            </div>
        </div>

        <!-- Tarjeta Flotante -->
        <div id="nearest-card" class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-96 z-10 glass-panel rounded-2xl p-3 shadow-2xl flex items-center justify-between border border-emerald-500/30">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-palette text-lg"></i>
                </div>
                <div>
                    <span class="text-[10px] uppercase text-emerald-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-network-wired"></i> Rutas Cercanas Diferenciadas
                    </span>
                    <h2 id="nearest-title" class="text-xs font-bold text-white truncate max-w-[200px]">Ubicando zona...</h2>
                    <p id="nearest-sub" class="text-[11px] text-gray-400">Radio de escaneo ~9km</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Panel Lateral de Rutas -->
    <aside id="side-drawer" class="fixed top-0 left-0 bottom-0 w-full sm:w-96 z-40 glass-panel border-r border-gray-800 transform -translate-x-full transition-transform duration-300 flex flex-col">
        
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <div>
                <h2 class="font-bold text-base text-white">Catálogo de Rutas</h2>
                <p id="route-count" class="text-[11px] text-gray-400">Cargando datos...</p>
            </div>
            <button id="btn-close-drawer" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Buscador -->
        <div class="p-3 border-b border-gray-800 bg-gray-950/60">
            <div class="relative flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="route-search-input" placeholder="Filtrar por código (34-A) o nombre..." 
                           class="w-full bg-gray-900 border border-gray-700/80 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
                </div>
                <button id="btn-search-route" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 rounded-xl text-xs font-bold transition">
                    Buscar
                </button>
            </div>
        </div>

        <!-- Lista Dinámica de Rutas -->
        <div id="nearby-routes-list" class="flex-1 overflow-y-auto p-4 space-y-2.5">
            <!-- Renderizado dinámico -->
        </div>
    </aside>

    <script>
        const APIMETRO_BASE_URL = "https://apimetro.dev/movilidad/mapas";

        let map;
        let userLocation = null;
        let userMarker = null;

        let loadedRoutesMap = new Map();
        let loadedStopsMap = new Map();
        let routeColorMap = new Map();

        let routesLayerGroup;
        let stopsLayerGroup;

        const SEARCH_RADIUS_DEG = 0.08; // Radio ~9 km

        // Generador de colores únicos en formato HSL distribuido
        function generateUniqueColor(index, total = 20) {
            const hue = (index * (360 / Math.max(total, 12))) % 360;
            return `hsl(${hue}, 85%, 55%)`;
        }

        function initMap() {
            map = L.map('map', { center: [19.4326, -99.1332], zoom: 13, zoomControl: false });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap | Datos Abiertos CDMX'
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            routesLayerGroup = L.layerGroup().addTo(map);
            stopsLayerGroup = L.layerGroup().addTo(map);

            getUserLocation();

            document.getElementById('btn-search-route').onclick = handleManualSearch;
            document.getElementById('route-search-input').addEventListener('input', () => renderDrawerList());
            document.getElementById('route-search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleManualSearch();
            });
        }

        function getUserLocation() {
            const apiStatus = document.getElementById('api-status');
            apiStatus.textContent = "Obteniendo GPS...";

            if (!navigator.geolocation) {
                fallbackLocation();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = [pos.coords.latitude, pos.coords.longitude];
                    updateUserMarker();
                    fetchNearbyData(userLocation[0], userLocation[1]);
                },
                () => fallbackLocation(),
                { enableHighAccuracy: true, timeout: 6000 }
            );
        }

        function fallbackLocation() {
            userLocation = [19.4230, -99.1630];
            updateUserMarker();
            fetchNearbyData(userLocation[0], userLocation[1]);
        }

        function updateUserMarker() {
            if (!userLocation) return;
            if (userMarker) map.removeLayer(userMarker);

            const icon = L.divIcon({
                className: 'custom-user-icon',
                html: `
                    <div class="relative flex items-center justify-center w-8 h-8">
                        <div class="absolute w-8 h-8 bg-blue-500/40 user-gps-pulse"></div>
                        <div class="w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-lg z-10"></div>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            userMarker = L.marker(userLocation, { icon: icon }).addTo(map);
            map.flyTo(userLocation, 13, { duration: 1.2 });
        }

        async function fetchNearbyData(lat, lon) {
            const apiStatus = document.getElementById('api-status');
            apiStatus.textContent = "Descargando rutas de CDMX...";

            const minLat = lat - SEARCH_RADIUS_DEG;
            const maxLat = lat + SEARCH_RADIUS_DEG;
            const minLon = lon - SEARCH_RADIUS_DEG;
            const maxLon = lon + SEARCH_RADIUS_DEG;

            try {
                const [routesRes, stopsRes] = await Promise.all([
                    fetch(`${APIMETRO_BASE_URL}/geojsonLinea?sistema=RTP`),
                    fetch(`${APIMETRO_BASE_URL}/geojsonEstacion?sistema=RTP`)
                ]);

                const routesData = await routesRes.json();
                const stopsData = await stopsRes.json();

                const nearbyRoutes = (routesData.features || []).filter(feature => 
                    isFeatureInBBox(feature, minLat, maxLat, minLon, maxLon)
                );

                const nearbyStops = (stopsData.features || []).filter(feature => {
                    const coords = feature.geometry?.coordinates;
                    if (!coords) return false;
                    return coords[1] >= minLat && coords[1] <= maxLat && coords[0] >= minLon && coords[0] <= maxLon;
                });

                // Registrar rutas y asignarles un color único por código
                nearbyRoutes.forEach((r) => {
                    const routeCode = getRouteCode(r);
                    const uniqueKey = r.properties.id || `${routeCode}_${getSentido(r)}_${Math.random()}`;
                    loadedRoutesMap.set(uniqueKey, r);
                });

                // Asignar color dinámico exclusivo a cada ruta
                let colorIndex = 0;
                const uniqueCodes = Array.from(new Set(Array.from(loadedRoutesMap.values()).map(r => getRouteCode(r))));
                uniqueCodes.forEach((code) => {
                    if (!routeColorMap.has(code)) {
                        routeColorMap.set(code, generateUniqueColor(colorIndex, uniqueCodes.length));
                        colorIndex++;
                    }
                });

                nearbyStops.forEach(s => {
                    const stopKey = s.properties.id || s.properties.nombre;
                    loadedStopsMap.set(stopKey, s);
                });

                apiStatus.textContent = `${uniqueCodes.length} rutas en tu área`;
                apiStatus.className = "text-[10px] text-emerald-400 font-medium";

                document.getElementById('nearest-title').textContent = `${uniqueCodes.length} rutas detectadas cerca`;
                document.getElementById('nearest-sub').textContent = `${loadedRoutesMap.size} trayectos (Ida y Regreso)`;
                document.getElementById('route-count').textContent = `${uniqueCodes.length} rutas registradas`;

                renderMapData();
                renderDrawerList();

            } catch (err) {
                console.error("Error al obtener datos:", err);
                apiStatus.textContent = "Error de conexión con API";
            }
        }

        function isFeatureInBBox(feature, minLat, maxLat, minLon, maxLon) {
            const geom = feature.geometry;
            if (!geom) return false;
            let coords = [];
            if (geom.type === 'LineString') coords = geom.coordinates;
            else if (geom.type === 'MultiLineString') coords = geom.coordinates.flat(1);
            
            return coords.some(c => Array.isArray(c) && c[1] >= minLat && c[1] <= maxLat && c[0] >= minLon && c[0] <= maxLon);
        }

        function getRouteCode(feature) {
            const p = feature.properties || {};
            return p.num_comercial || p.linea || p.codigo || p.ruta || "RTP";
        }

        function getRouteName(feature) {
            const p = feature.properties || {};
            let name = p.nombre || p.denominacion || p.origen_destino || p.nombre_linea || "Ruta de RTP";
            const code = getRouteCode(feature);
            if (name.startsWith(code)) {
                name = name.replace(code, '').replace(/^[\s\-:]+/, '');
            }
            return name.trim() || `Ruta ${code}`;
        }

        function getSentido(feature) {
            const p = feature.properties || {};
            const str = (p.sentido || p.direccion || p.sentido_circulacion || '').toString().toLowerCase();
            if (str.includes('2') || str.includes('b') || str.includes('regreso') || str.includes('sur') || str.includes('poniente')) {
                return "Regreso";
            }
            return "Ida";
        }

        async function handleManualSearch() {
            const query = document.getElementById('route-search-input').value.trim();
            if (!query) return;

            const apiStatus = document.getElementById('api-status');
            apiStatus.textContent = `Buscando "${query}"...`;

            try {
                const response = await fetch(`${APIMETRO_BASE_URL}/geojsonLinea?sistema=RTP`);
                const data = await response.json();

                const matchedFeatures = (data.features || []).filter(f => {
                    const code = getRouteCode(f).toLowerCase();
                    const name = getRouteName(f).toLowerCase();
                    const q = query.toLowerCase();
                    return code.includes(q) || name.includes(q);
                });

                if (matchedFeatures.length > 0) {
                    matchedFeatures.forEach(f => {
                        const routeCode = getRouteCode(f);
                        const uniqueKey = f.properties.id || `${routeCode}_${getSentido(f)}_${Math.random()}`;
                        loadedRoutesMap.set(uniqueKey, f);

                        if (!routeColorMap.has(routeCode)) {
                            routeColorMap.set(routeCode, generateUniqueColor(routeColorMap.size, 15));
                        }
                    });

                    apiStatus.textContent = `Ruta "${query}" agregada`;
                    renderMapData();
                    renderDrawerList();

                    const tempLayer = L.geoJSON(matchedFeatures);
                    map.fitBounds(tempLayer.getBounds(), { padding: [50, 50] });
                } else {
                    alert(`No se encontró la ruta "${query}" en el catálogo.`);
                    apiStatus.textContent = "Sin resultados";
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderMapData() {
            routesLayerGroup.clearLayers();
            stopsLayerGroup.clearLayers();

            const routesArray = Array.from(loadedRoutesMap.values());
            
            L.geoJSON(routesArray, {
                style: (feature) => {
                    const routeCode = getRouteCode(feature);
                    const color = routeColorMap.get(routeCode) || '#006837';
                    const sentido = getSentido(feature);

                    return {
                        color: color,
                        weight: 5,
                        opacity: 0.9,
                        dashArray: sentido === "Regreso" ? "8, 8" : null // Continua para Ida, Punteada para Regreso
                    };
                },
                onEachFeature: (feature, layer) => {
                    const routeCode = getRouteCode(feature);
                    const routeName = getRouteName(feature);
                    const color = routeColorMap.get(routeCode) || '#006837';
                    const sentido = getSentido(feature);

                    layer.bindTooltip(`[Ruta ${routeCode}] ${routeName} (${sentido})`, {
                        permanent: false,
                        direction: 'center',
                        className: 'route-label-tooltip'
                    });

                    layer.bindPopup(`
                        <div class="p-3">
                            <div class="flex items-center gap-1.5 mb-1.5">
                                <span class="text-xs font-bold px-2 py-0.5 rounded text-white shadow" style="background-color: ${color}">
                                    Ruta ${routeCode}
                                </span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${sentido === 'Ida' ? 'bg-emerald-950 text-emerald-400 border-emerald-500/40' : 'bg-amber-950 text-amber-400 border-amber-500/40'}">
                                    <i class="fa-solid ${sentido === 'Ida' ? 'fa-arrow-right' : 'fa-arrow-left'} text-[9px]"></i> ${sentido}
                                </span>
                            </div>
                            <h3 class="font-bold text-sm text-white leading-tight">${routeName}</h3>
                            <p class="text-[11px] text-gray-400 mt-1">
                                Trazo en mapa: <span class="text-gray-200 font-semibold">${sentido === 'Ida' ? 'Línea Continua' : 'Línea Discontinua (Punteada)'}</span>
                            </p>
                        </div>
                    `);
                }
            }).addTo(routesLayerGroup);

            // Renderizar paradas asociadas
            const stopsArray = Array.from(loadedStopsMap.values());
            L.geoJSON(stopsArray, {
                pointToLayer: (feature, latlng) => {
                    const routeCode = getRouteCode(feature);
                    const color = routeColorMap.get(routeCode) || '#006837';
                    
                    const customStopIcon = L.divIcon({
                        className: 'rtp-stop-icon',
                        html: `<div style="background-color: ${color}; width: 10px; height: 10px; border-radius: 50%;"></div>`,
                        iconSize: [10, 10],
                        iconAnchor: [5, 5]
                    });

                    return L.marker(latlng, { icon: customStopIcon });
                },
                onEachFeature: (feature, layer) => {
                    const props = feature.properties;
                    layer.bindPopup(`
                        <div class="p-3">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase">
                                <i class="fa-solid fa-bus"></i> Parada de RTP
                            </span>
                            <h3 class="font-bold text-sm text-white mt-0.5">${props.nombre || 'Parada oficial'}</h3>
                        </div>
                    `);
                }
            }).addTo(stopsLayerGroup);
        }

        function renderDrawerList() {
            const container = document.getElementById('nearby-routes-list');
            const searchFilter = document.getElementById('route-search-input').value.trim().toLowerCase();
            container.innerHTML = '';

            const groupedRoutes = new Map();

            loadedRoutesMap.forEach((feature) => {
                const routeCode = getRouteCode(feature);
                const routeName = getRouteName(feature);

                if (searchFilter) {
                    const matchCode = routeCode.toLowerCase().includes(searchFilter);
                    const matchName = routeName.toLowerCase().includes(searchFilter);
                    if (!matchCode && !matchName) return;
                }

                if (!groupedRoutes.has(routeCode)) {
                    groupedRoutes.set(routeCode, []);
                }
                groupedRoutes.get(routeCode).push(feature);
            });

            if (groupedRoutes.size === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 px-4 bg-gray-900/60 rounded-xl border border-gray-800">
                        <i class="fa-solid fa-magnifying-glass text-gray-500 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-gray-300">No hay coincidencias</h4>
                        <p class="text-[11px] text-gray-500 mt-1">Ingresa el número o nombre en la barra de búsqueda.</p>
                    </div>
                `;
                return;
            }

            groupedRoutes.forEach((features, routeCode) => {
                const color = routeColorMap.get(routeCode) || '#006837';
                const mainName = getRouteName(features[0]);

                const card = document.createElement('div');
                card.className = "p-3 bg-gray-900/90 rounded-xl border border-gray-800 hover:border-emerald-500/50 transition cursor-pointer space-y-2.5 shadow-sm";
                
                card.innerHTML = `
                    <div class="flex items-start gap-2.5">
                        <span class="text-xs font-extrabold px-2 py-1 rounded text-white shadow shrink-0" style="background-color: ${color}">
                            Ruta ${routeCode}
                        </span>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-xs text-white leading-tight truncate">${mainName}</h4>
                            <p class="text-[10px] text-gray-400 mt-1 flex items-center gap-2">
                                <span><i class="fa-solid fa-minus text-emerald-400"></i> Ida</span>
                                <span><i class="fa-solid fa-ellipsis text-amber-400"></i> Regreso</span>
                            </p>
                        </div>
                    </div>
                    
                    <button class="w-full bg-gray-800 hover:bg-emerald-950/80 text-white border border-gray-700 hover:border-emerald-500/50 text-[11px] font-bold py-2 px-3 rounded-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-route text-emerald-400"></i> Ver Ruta Completa (Ida + Regreso)
                    </button>
                `;

                // Al hacer clic en cualquier parte de la tarjeta o en el botón, se muestran AMBOS trayectos (Ida y Regreso)
                card.onclick = () => {
                    const combinedGeoJSON = {
                        type: "FeatureCollection",
                        features: features
                    };
                    const bounds = L.geoJSON(combinedGeoJSON).getBounds();
                    map.fitBounds(bounds, { padding: [50, 50] });

                    if (window.innerWidth < 640) {
                        document.getElementById('side-drawer').classList.add('-translate-x-full');
                    }
                };

                container.appendChild(card);
            });
        }

        // Control visual de la interfaz
        document.getElementById('btn-toggle-drawer').onclick = () => document.getElementById('side-drawer').classList.remove('-translate-x-full');
        document.getElementById('btn-close-drawer').onclick = () => document.getElementById('side-drawer').classList.add('-translate-x-full');
        document.getElementById('btn-locate').onclick = () => getUserLocation();

        window.onload = initMap;
    </script>
</body>
</html>
