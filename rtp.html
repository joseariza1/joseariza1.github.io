<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTP CDMX - Red Completa y Paradas (Apimetro)</title>
    
    <meta name="theme-color" content="#006837">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #121212; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .glass-panel {
            background: rgba(18, 18, 18, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaflet-popup-content-wrapper {
            background: #1e1e1e !important;
            color: #f3f4f6 !important;
            border-radius: 12px !important;
            padding: 0 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }
        .leaflet-popup-tip { background: #1e1e1e !important; }
        .leaflet-popup-content { margin: 0 !important; }

        @keyframes userPulse {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .user-gps-pulse { animation: userPulse 2s infinite ease-out; border-radius: 50%; }

        .rtp-stop-icon {
            background: #006837;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- Header Control -->
    <header class="absolute top-0 left-0 right-0 z-20 p-3 pointer-events-none flex justify-between items-center">
        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-toggle-drawer" class="glass-panel text-white p-3 rounded-xl shadow-lg hover:bg-gray-800 transition">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="glass-panel px-3 py-2 rounded-xl shadow-lg flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-700 flex items-center justify-center text-white font-bold text-sm shadow">
                    RTP
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white">RTP CDMX (Red Total)</h1>
                    <span id="api-status" class="text-[10px] text-amber-400 font-medium">Conectando a Apimetro...</span>
                </div>
            </div>
        </div>

        <div class="pointer-events-auto flex items-center gap-2">
            <button id="btn-locate" class="glass-panel bg-blue-600/30 text-blue-300 border border-blue-500/40 px-3 py-2 rounded-xl text-xs font-semibold shadow-lg hover:bg-blue-600/50 transition flex items-center gap-1.5">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span class="hidden sm:inline">Mi Ubicación</span>
            </button>
        </div>
    </header>

    <!-- Mapa -->
    <main class="relative flex-1 w-full h-full">
        <div id="map"></div>

        <!-- Tarjeta Flotante de Ruta Más Cercana -->
        <div id="nearest-card" class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-96 z-10 glass-panel rounded-2xl p-3 shadow-2xl flex items-center justify-between border border-emerald-500/30">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-bus text-lg"></i>
                </div>
                <div>
                    <span class="text-[10px] uppercase text-emerald-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-bolt"></i> Sistema Apimetro.dev
                    </span>
                    <h2 id="nearest-title" class="text-xs font-bold text-white truncate max-w-[180px]">Cargando paradas...</h2>
                    <p id="nearest-sub" class="text-[11px] text-gray-400">Obteniendo red de RTP</p>
                </div>
            </div>
            <button id="btn-focus-nearest" class="bg-emerald-600/30 text-emerald-300 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-emerald-600/60 transition">
                Ver
            </button>
        </div>
    </main>

    <!-- Panel Lateral -->
    <aside id="side-drawer" class="fixed top-0 left-0 bottom-0 w-full sm:w-96 z-40 glass-panel border-r border-gray-800 transform -translate-x-full transition-transform duration-300 flex flex-col">
        
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <div>
                <h2 class="font-bold text-base text-white">Catálogo de Rutas RTP</h2>
                <p id="route-count" class="text-[11px] text-gray-400">Cargando datos desde Apimetro...</p>
            </div>
            <button id="btn-close-drawer" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Buscador de Rutas -->
        <div class="p-3 border-b border-gray-800 bg-gray-950/60">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="route-search-input" placeholder="Buscar ruta o parada (ej. 34-A, Santa Fe)..." 
                       class="w-full bg-gray-900 border border-gray-700/80 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Lista de Rutas -->
        <div id="nearby-routes-list" class="flex-1 overflow-y-auto p-4 space-y-2.5">
            <!-- Se llena dinámicamente -->
        </div>
    </aside>

    <script>
        const APIMETRO_ROUTES_URL = "https://apimetro.dev/movilidad/mapas/geojsonLinea?sistema=RTP";
        const APIMETRO_STOPS_URL = "https://apimetro.dev/movilidad/mapas/geojsonEstacion?sistema=RTP";

        let map;
        let userLocation = null;
        let userMarker = null;

        let routesLayerGroup;
        let stopsLayerGroup;

        let routesGeoData = [];
        let stopsGeoData = [];

        function initMap() {
            map = L.map('map', { center: [19.4326, -99.1332], zoom: 12, zoomControl: false });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap | Datos: <a href="https://apimetro.dev" target="_blank" class="underline">Apimetro.dev</a>'
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            routesLayerGroup = L.layerGroup().addTo(map);
            stopsLayerGroup = L.layerGroup().addTo(map);

            getUserLocation();
            loadApimetroData();

            document.getElementById('route-search-input').addEventListener('input', (e) => {
                renderRoutesList(e.target.value);
            });
        }

        async function loadApimetroData() {
            const apiStatus = document.getElementById('api-status');
            apiStatus.textContent = "Obteniendo datos de Apimetro...";

            try {
                // Peticiones simultáneas a Apimetro para Rutas y Paradas
                const [routesResponse, stopsResponse] = await Promise.all([
                    fetch(APIMETRO_ROUTES_URL),
                    fetch(APIMETRO_STOPS_URL)
                ]);

                const routesData = await routesResponse.json();
                const stopsData = await stopsResponse.json();

                routesGeoData = routesData.features || [];
                stopsGeoData = stopsData.features || [];

                apiStatus.textContent = "Apimetro Conectado";
                apiStatus.className = "text-[10px] text-emerald-400 font-medium";

                document.getElementById('route-count').textContent = `${routesGeoData.length} líneas y ${stopsGeoData.length} paradas registradas`;

                renderRoutesOnMap();
                renderStopsOnMap();
                renderRoutesList();

                if (routesGeoData.length > 0) {
                    const firstRoute = routesGeoData[0].properties;
                    document.getElementById('nearest-title').textContent = `${firstRoute.nombre || firstRoute.num_comercial || 'Red RTP'}`;
                    document.getElementById('nearest-sub').textContent = `${stopsGeoData.length} paradas activas cargadas`;
                }

            } catch (error) {
                console.error("Error al obtener datos de Apimetro:", error);
                apiStatus.textContent = "Error de conexión con API";
                apiStatus.className = "text-[10px] text-red-400 font-medium";
            }
        }

        function renderRoutesOnMap() {
            routesLayerGroup.clearLayers();

            L.geoJSON(routesGeoData, {
                style: function(feature) {
                    return {
                        color: feature.properties.color || '#006837',
                        weight: 4,
                        opacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const name = props.nombre || props.num_comercial || "Ruta RTP";
                    const routeNum = props.num_comercial || "RTP";

                    layer.bindPopup(`
                        <div class="p-3">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase">Ruta ${routeNum}</span>
                            <h3 class="font-bold text-sm text-white mt-0.5">${name}</h3>
                            <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-route text-emerald-400"></i> Trazo oficial de Apimetro</p>
                        </div>
                    `);
                }
            }).addTo(routesLayerGroup);
        }

        function renderStopsOnMap() {
            stopsLayerGroup.clearLayers();

            const customStopIcon = L.divIcon({
                className: 'rtp-stop-icon',
                iconSize: [10, 10],
                iconAnchor: [5, 5]
            });

            L.geoJSON(stopsGeoData, {
                pointToLayer: function(feature, latlng) {
                    return L.marker(latlng, { icon: customStopIcon });
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const stopName = props.nombre || "Parada de RTP";
                    const alcaldia = props.alcaldia_municipio || "CDMX";

                    layer.bindPopup(`
                        <div class="p-3">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase"><i class="fa-solid fa-bus-simple"></i> Parada Oficial</span>
                            <h3 class="font-bold text-sm text-white mt-0.5">${stopName}</h3>
                            <p class="text-xs text-gray-400 mt-1">${alcaldia}</p>
                        </div>
                    `);
                }
            }).addTo(stopsLayerGroup);
        }

        function renderRoutesList(filterText = '') {
            const container = document.getElementById('nearby-routes-list');
            container.innerHTML = '';

            const term = filterText.toLowerCase().trim();

            const filtered = routesGeoData.filter(feature => {
                const props = feature.properties;
                const name = (props.nombre || '').toLowerCase();
                const num = (props.num_comercial || '').toLowerCase();
                return name.includes(term) || num.includes(term);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 px-4 bg-gray-900/60 rounded-xl border border-gray-800">
                        <i class="fa-solid fa-magnifying-glass text-gray-500 text-2xl mb-2"></i>
                        <h4 class="text-xs font-bold text-gray-300">No se encontraron resultados</h4>
                        <p class="text-[11px] text-gray-500 mt-1">Prueba filtrando por número o alcaldía.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((feature, index) => {
                const props = feature.properties;
                const name = props.nombre || "Ruta Sin Nombre";
                const num = props.num_comercial || `R-${index+1}`;
                const color = props.color || '#006837';

                const card = document.createElement('div');
                card.className = "p-3 bg-gray-900 rounded-xl border border-gray-800 hover:border-emerald-500/50 cursor-pointer transition space-y-1.5";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded text-white" style="background-color: ${color}">
                                ${num}
                            </span>
                            <span class="font-semibold text-xs text-white truncate max-w-[170px]">${name}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => {
                    const tempGeoJson = L.geoJSON(feature);
                    map.fitBounds(tempGeoJson.getBounds(), { padding: [50, 50] });

                    if (window.innerWidth < 640) {
                        document.getElementById('side-drawer').classList.add('-translate-x-full');
                    }
                };

                container.appendChild(card);
            });
        }

        function getUserLocation() {
            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = [pos.coords.latitude, pos.coords.longitude];
                    updateUserMarker();
                },
                () => { userLocation = [19.4230, -99.1630]; updateUserMarker(); },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        function updateUserMarker() {
            if (!userLocation) return;
            if (userMarker) map.removeLayer(userMarker);

            const icon = L.divIcon({
                className: 'custom-user-icon',
                html: `
                    <div class="relative flex items-center justify-center w-8 h-8">
                        <div class="absolute w-8 h-8 bg-blue-500/40 user-gps-pulse"></div>
                        <div class="w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-lg z-10"></div>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            userMarker = L.marker(userLocation, { icon: icon }).addTo(map);
        }

        // Interacción UI
        document.getElementById('btn-toggle-drawer').onclick = () => document.getElementById('side-drawer').classList.remove('-translate-x-full');
        document.getElementById('btn-close-drawer').onclick = () => document.getElementById('side-drawer').classList.add('-translate-x-full');
        document.getElementById('btn-locate').onclick = () => {
            if (userLocation) map.flyTo(userLocation, 14, { duration: 1.2 });
            else getUserLocation();
        };

        window.onload = initMap;
    </script>
</body>
</html>
